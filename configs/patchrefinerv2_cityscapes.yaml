# PatchRefinerV2 - Cityscapes configuration
# Model: PatchRefinerSemi with PatchRefinerPlus student (EfficientNet-B5) + PatchRefiner teacher

# Shared ZoeDepth config
_zoe_depth_config: &zoe_depth_config
  type: ZoeDepth
  min_depth: 0.001
  max_depth: 250
  midas_model_type: DPT_BEiT_L_384
  pretrained_resource: null
  use_pretrained_midas: true
  train_midas: true
  freeze_midas_bn: true
  do_resize: false
  attractor_alpha: 1000
  attractor_gamma: 2
  attractor_kind: mean
  attractor_type: inv
  aug: true
  bin_centers_type: softplus
  bin_embedding_dim: 128
  clip_grad: 0.1
  dataset: nyu
  distributed: true
  force_keep_ar: true
  gpu: 'NULL'
  img_size: [384, 512]
  inverse_midas: false
  log_images_every: 0.1
  max_temp: 50.0
  max_translation: 100
  memory_efficient: true
  min_temp: 0.0212
  model: zoedepth
  n_attractors: [16, 8, 4, 1]
  n_bins: 64
  name: ZoeDepth
  notes: ''
  output_distribution: logbinomial
  prefetch: false
  print_losses: false
  project: ZoeDepth
  random_crop: false
  random_translate: false
  root: '.'
  save_dir: ''
  shared_dict: 'NULL'
  tags: ''
  translate_prob: 0.2
  uid: 'NULL'
  use_amp: false
  use_shared_dict: false
  validate_every: 0.25
  version_name: v1
  workers: 16

model:
  type: PatchRefinerSemi
  model_cfg_student:
    type: PatchRefinerPlus
    config:
      e2e_training: true
      pretrain_stage: false

      image_raw_shape: [1024, 2048]
      patch_process_shape: [384, 512]
      patch_raw_shape: [256, 512]
      patch_split_num: [4, 4]

      fusion_feat_level: 6
      min_depth: 0.001
      max_depth: 250

      pretrain_coarse_model: null
      strategy_refiner_target: offset_coarse

      coarse_branch: *zoe_depth_config

      refiner:
        fine_branch:
          type: LightWeightRefiner
          coarse_condition: true
          with_decoder: false
          encoder_name: tf_efficientnet_b5_ap
        fusion_model:
          type: BiDirectionalFusion
          encoder_name: tf_efficientnet_b5_ap
          coarse2fine: true
          coarse2fine_type: coarse-gated
          coarse_chl: [32, 256, 256, 256, 256, 256]
          fine_chl: [24, 40, 64, 176, 512]
          fine_chl_after_coarse2fine: [32, 256, 256, 256, 256, 256]
          temp_chl: [32, 64, 64, 128, 256, 512]
          dec_chl: [512, 256, 128, 64, 32]

      sigloss:
        type: SILogLoss
      gmloss:
        type: GradMatchLoss

      sigweight: 1
      pre_norm_bbox: true
      pretrained: null
      whole_pretrained: null

  model_cfg_teacher:
    type: PatchRefiner
    config:
      image_raw_shape: [1024, 2048]
      patch_process_shape: [384, 512]
      patch_raw_shape: [256, 512]
      patch_split_num: [4, 4]

      fusion_feat_level: 6
      min_depth: 0.001
      max_depth: 250

      pretrain_fine_model: null
      pretrain_coarse_model: null
      strategy_refiner_target: offset_coarse

      coarse_branch: *zoe_depth_config

      refiner:
        fine_branch: *zoe_depth_config
        fusion_model:
          type: FusionUnet
          input_chl: [64, 512, 512, 512, 512, 512]
          temp_chl: [32, 256, 256, 256, 256, 256]
          dec_chl: [256, 256, 256, 256, 32]

      sigloss:
        type: SILogLoss
      load_whole: true
      pretrained: null
      pre_norm_bbox: true

  mix_loss: false
  edge_loss_weight: 0.5
  edgeloss:
    type: SSIGMProposalLoss
  sigloss:
    type: SILogLoss
  min_depth: 0.001
  max_depth: 250

collect_input_args:
  - image_lr
  - image_hr
  - crops_image_hr
  - depth_gt
  - crop_depths
  - bboxs
  - center_mask
  - pseudo_label
  - seg_image

# Benchmark evaluation dataloader (Cityscapes)
val_dataloader:
  batch_size: 1
  num_workers: 1
  dataset:
    type: CityScapesDataset
    mode: infer
    with_seg_map: true
    split: ./data/cityscapes/val.txt
    min_depth: 0.001
    max_depth: 250
    transform_cfg:
      degree: 1.0
      network_process_size: [384, 512]

# General inference dataloader (custom images)
general_dataloader:
  batch_size: 1
  num_workers: 2
  dataset:
    type: ImageDataset
    rgb_image_dir: ''
    dataset_name: ''
    gt_dir: null
    network_process_size: [384, 512]
    resize_mode: zoe
